<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#c8245d"><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23c8245d'/%3E%3Ctext x='16' y='23' font-size='18' text-anchor='middle' fill='white' font-family='Arial' font-weight='700'%3E2%3C/text%3E%3C/svg%3E">
<title>Two-Seat Cinema</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800;900&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}
/* Layout: a single-screen cinema lobby. Sticky marquee header with three doors (Pile / Tonight / Scoreboard); posters as a dense grid; Tonight is a slot reel that prints a ticket. */
:root{
  --paper:#eceff5; --surface:#ffffff; --sunk:#dfe3ec; --ink:#14151d; --muted:#5b6070; --line:#c9cedb;
  --magenta:#c8245d; --magenta-ink:#ffffff; --teal:#0b7a7c; --marigold:#e9a000; --stub:#fff4d6; --stub-ink:#2a1d00;
  --good:#1f8a4c; --shadow:0 1px 0 rgba(20,21,29,.06),0 8px 24px -12px rgba(20,21,29,.25);
  --display:"Big Shoulders Display","Arial Narrow","Roboto Condensed",Impact,sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#11131d; --surface:#1a1d2b; --sunk:#232738; --ink:#eceef6; --muted:#9aa0b4; --line:#2f3448;
  --magenta:#ff4f8b; --magenta-ink:#1a0610; --teal:#3cc2c4; --marigold:#ffbe2e; --stub:#2b2412; --stub-ink:#ffe6a8;
  --good:#4fd18a; --shadow:0 1px 0 rgba(0,0,0,.4),0 10px 30px -14px rgba(0,0,0,.8); color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#11131d; --surface:#1a1d2b; --sunk:#232738; --ink:#eceef6; --muted:#9aa0b4; --line:#2f3448;
  --magenta:#ff4f8b; --magenta-ink:#1a0610; --teal:#3cc2c4; --marigold:#ffbe2e; --stub:#2b2412; --stub-ink:#ffe6a8;
  --good:#4fd18a; --shadow:0 1px 0 rgba(0,0,0,.4),0 10px 30px -14px rgba(0,0,0,.8); color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
a.btn{text-decoration:none;color:var(--ink)}
.chip .dot,.plat i,.where a i{box-shadow:0 0 0 1px color-mix(in srgb,var(--ink) 25%,transparent)}
.chip.ftoggle{display:none}
@media (max-width:700px){header{position:static}.chip.ftoggle{display:inline-flex}nav button{padding:7px 11px;font-size:13px;white-space:nowrap}.filters:not(.open) .fx{display:none}}
body{background:var(--paper);color:var(--ink);font:15px/1.5 var(--body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--magenta);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto}

/* Marquee header */
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);padding-block:14px 10px;border-bottom:1px solid var(--line)}
.top{display:flex;align-items:center;gap:14px;flex-wrap:wrap;justify-content:space-between}
.brand{display:flex;align-items:baseline;gap:10px;min-width:0}
.brand h1{font:900 34px/0.9 var(--display);letter-spacing:.01em;text-transform:uppercase;margin:0}
.brand h1 span{color:var(--magenta)}
.brand small{font:500 12px var(--mono);color:var(--muted);white-space:nowrap}
nav{display:flex;gap:4px;background:var(--sunk);padding:4px;border-radius:999px}
nav button{border:0;background:transparent;padding:7px 16px;border-radius:999px;font-weight:600;font-size:14px}
nav button[aria-selected="true"]{background:var(--ink);color:var(--paper)}
.me{font:500 12px var(--mono);color:var(--muted);display:flex;gap:8px;align-items:center}
.lvl{background:var(--marigold);color:#1d1400;padding:2px 8px;border-radius:999px;font-weight:600}
.syncnote{font:500 12px var(--body);color:var(--muted);margin-top:6px}

main{padding-top:18px}
section[hidden]{display:none}

/* Pile filters */
.filters{display:grid;gap:10px;margin-bottom:16px}
.searchrow{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.search{flex:1 1 240px;min-width:0;display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:8px 14px}
.search input{border:0;background:transparent;outline:0;flex:1;min-width:0}
select{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:8px 12px}
.chips{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.chips .lab{font:600 11px var(--mono);text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-right:4px;min-width:64px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 11px;font-size:13px;font-weight:500;display:inline-flex;gap:6px;align-items:center}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.chip .dot{width:8px;height:8px;border-radius:50%}
.count{font:600 13px var(--mono);color:var(--muted)}
.clear{border:0;background:none;color:var(--magenta);font-weight:600;font-size:13px;padding:4px}

/* Poster grid */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:18px 14px}
@media (max-width:480px){.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 10px}}
.card{border:0;background:none;padding:0;text-align:left;display:flex;flex-direction:column;gap:7px;min-width:0}
.pwrap{position:relative;aspect-ratio:2/3;max-width:100%;border-radius:var(--r);overflow:hidden;background:var(--sunk);box-shadow:var(--shadow);transition:transform .18s ease}
.card:hover .pwrap{transform:translateY(-3px) rotate(-.4deg)}
.pwrap img{width:100%;height:100%;object-fit:cover;display:block}
.noposter{position:absolute;inset:0;display:grid;place-items:center;padding:12px;text-align:center;font:800 22px/1 var(--display);text-transform:uppercase;color:var(--muted)}
.score{position:absolute;top:7px;left:7px;font:600 11px var(--mono);background:rgba(10,10,14,.78);color:#fff;padding:2px 6px;border-radius:6px}
.stamp{position:absolute;bottom:8px;right:-4px;font:800 13px var(--display);letter-spacing:.06em;text-transform:uppercase;padding:3px 10px 3px 8px;transform:rotate(-4deg);box-shadow:0 2px 6px rgba(0,0,0,.3)}
.stamp.watched{background:var(--good);color:#fff}
.stamp.want{background:var(--marigold);color:#1d1400}
.stamp.nah{background:#555a6a;color:#fff}
.stamp.soon{background:var(--teal);color:#fff}
.ctitle{font-weight:600;font-size:14px;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.cmeta{font:500 11.5px var(--mono);color:var(--muted);display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.plat{display:inline-flex;gap:3px}
.plat i{width:7px;height:7px;border-radius:50%;display:inline-block}
.empty{padding:40px 16px;text-align:center;color:var(--muted)}
.grid .empty{grid-column:1/-1}

/* Tonight */
.tonight{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:24px;align-items:start}
@media (max-width:820px){.tonight{grid-template-columns:minmax(0,1fr)}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;display:grid;gap:16px}
.panel h2{font:900 30px/1 var(--display);text-transform:uppercase;margin:0}
.panel p.sub{margin:-8px 0 0;color:var(--muted);font-size:14px}
.q{display:grid;gap:8px}
.q .lab{font:600 11px var(--mono);text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.pool{font:600 13px var(--mono);color:var(--muted)}
.pool b{color:var(--ink)}
.big{border:0;background:var(--magenta);color:var(--magenta-ink);font:900 24px/1 var(--display);text-transform:uppercase;letter-spacing:.04em;padding:16px 22px;border-radius:12px;width:100%;box-shadow:0 6px 0 color-mix(in srgb,var(--magenta) 55%,#000)}
.big:active{transform:translateY(3px);box-shadow:0 3px 0 color-mix(in srgb,var(--magenta) 55%,#000)}
.big:disabled{opacity:.45;cursor:not-allowed}
.stage{display:grid;gap:16px;justify-items:center}
.reel{position:relative;width:min(260px,70vw);aspect-ratio:2/3;border-radius:14px;overflow:hidden;background:var(--ink);box-shadow:0 0 0 6px var(--sunk),0 0 0 7px var(--line),var(--shadow)}
.reel::before,.reel::after{content:"";position:absolute;left:0;right:0;height:18%;z-index:2;pointer-events:none}
.reel::before{top:0;background:linear-gradient(var(--ink),transparent)}
.reel::after{bottom:0;background:linear-gradient(transparent,var(--ink))}
.strip{position:absolute;inset:0 0 auto 0;will-change:transform}
.strip img,.strip .ph{display:block;width:100%;aspect-ratio:2/3;object-fit:cover}
.strip .ph{background:var(--sunk);display:grid;place-items:center;font:800 26px var(--display);color:var(--muted);text-transform:uppercase;padding:14px;text-align:center}
.reelidle{position:absolute;inset:0;display:grid;place-items:center;text-align:center;color:#fff;z-index:3;padding:20px;font:800 30px/1 var(--display);text-transform:uppercase;letter-spacing:.03em}
.reelidle small{display:block;font:500 13px var(--body);text-transform:none;letter-spacing:0;opacity:.7;margin-top:8px}

/* Ticket */
.ticket{width:min(440px,100%);background:var(--stub);color:var(--stub-ink);border-radius:12px;display:grid;grid-template-columns:minmax(0,1fr) 92px;position:relative;filter:drop-shadow(0 10px 18px rgba(0,0,0,.18));animation:print .55s cubic-bezier(.2,.8,.2,1)}
@keyframes print{from{transform:translateY(-18px);opacity:0}to{transform:none;opacity:1}}
.ticket::before,.ticket::after{content:"";position:absolute;right:80px;width:24px;height:24px;border-radius:50%;background:var(--surface)}
.ticket::before{top:-12px}.ticket::after{bottom:-12px}
.tmain{padding:16px 18px;display:grid;gap:6px;min-width:0}
.tkicker{font:600 11px var(--mono);letter-spacing:.12em;text-transform:uppercase;opacity:.75}
.ttitle{font:900 32px/0.95 var(--display);text-transform:uppercase;text-wrap:balance;overflow-wrap:anywhere}
.tline{font:500 12.5px var(--mono);display:flex;gap:10px;flex-wrap:wrap}
.tstub{border-left:2px dashed color-mix(in srgb,var(--stub-ink) 35%,transparent);padding:14px 10px;display:grid;place-items:center;text-align:center;font:600 11px var(--mono);letter-spacing:.06em}
.tstub b{font:900 30px/1 var(--display);display:block}
.tactions{display:flex;gap:10px;flex-wrap:wrap;width:min(440px,100%)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 14px;font-weight:600;display:inline-flex;align-items:center;gap:8px;justify-content:center}
.btn.primary{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.btn.grow{flex:1 1 140px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.showing{width:min(440px,100%);border:2px solid var(--teal);border-radius:14px;padding:14px;display:grid;gap:10px}
.showing .k{font:600 11px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--teal)}

/* Scoreboard */
.board{display:grid;gap:22px}
.players{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.player{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;display:grid;gap:10px}
.player .nm{font:800 24px/1 var(--display);text-transform:uppercase}
.player .rank{font:600 12px var(--mono);color:var(--muted)}
.bar{height:10px;background:var(--sunk);border-radius:999px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--magenta);border-radius:999px}
.stats{display:flex;gap:16px;flex-wrap:wrap;font:500 12.5px var(--mono);color:var(--muted)}
.stats b{display:block;font:900 26px/1 var(--display);color:var(--ink)}
.h3{font:900 24px/1 var(--display);text-transform:uppercase;margin:0 0 10px}
.together{display:flex;gap:20px;align-items:center;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px}
.ring{width:96px;height:96px;flex:none}
.together .big2{font:900 40px/1 var(--display)}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}
.badge{border:1px dashed var(--line);border-radius:12px;padding:12px;display:grid;gap:4px;color:var(--muted)}
.badge b{font:800 18px/1 var(--display);text-transform:uppercase;color:var(--muted)}
.badge.on{border-style:solid;border-color:var(--marigold);background:color-mix(in srgb,var(--marigold) 12%,var(--surface));color:var(--ink)}
.badge.on b{color:var(--ink)}
.badge small{font:500 12px var(--body)}
.history{display:grid;gap:8px}
.hrow{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px}
.hrow img,.hrow .phs{width:44px;aspect-ratio:2/3;object-fit:cover;border-radius:6px;background:var(--sunk)}
.hrow .t{font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hrow .d{font:500 12px var(--mono);color:var(--muted)}

/* Detail dialog */
dialog{border:0;padding:0;border-radius:18px;background:var(--surface);color:var(--ink);width:min(760px,calc(100vw - 32px));max-height:calc(100dvh - 48px);box-shadow:0 30px 80px -20px rgba(0,0,0,.6)}
dialog::backdrop{background:rgba(8,9,14,.62);backdrop-filter:blur(3px)}
.dl{display:grid;grid-template-columns:220px minmax(0,1fr);gap:20px;padding:20px}
@media (max-width:600px){.dl{grid-template-columns:minmax(0,1fr)}.dl .dp{max-width:200px}}
.dp{border-radius:12px;overflow:hidden;aspect-ratio:2/3;background:var(--sunk);position:relative;max-width:100%}
.dp img{width:100%;height:100%;object-fit:cover;display:block}
.dbody{display:grid;gap:12px;align-content:start;min-width:0}
.dtitle{font:900 38px/0.95 var(--display);text-transform:uppercase;margin:0;text-wrap:balance}
.dorig{color:var(--muted);font-style:italic;font-size:14px;margin-top:-6px}
.dmeta{font:500 13px var(--mono);color:var(--muted);display:flex;gap:10px;flex-wrap:wrap}
.dover{margin:0;max-width:62ch}
.dcrew{font-size:14px;color:var(--muted)}
.dcrew b{color:var(--ink);font-weight:600}
.where{display:flex;gap:8px;flex-wrap:wrap}
.where a{display:inline-flex;gap:6px;align-items:center;border:1px solid var(--line);border-radius:999px;padding:5px 12px;text-decoration:none;color:var(--ink);font-weight:600;font-size:13px}
.where a i{width:9px;height:9px;border-radius:50%}
.where a small{font-weight:500;color:var(--muted)}
.note{font-size:13px;background:var(--sunk);border-radius:8px;padding:8px 10px;color:var(--muted)}
.marks{display:flex;gap:8px;flex-wrap:wrap}
.marks .btn[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.stars{display:flex;gap:2px}
.stars button{border:0;background:none;font-size:24px;line-height:1;padding:2px;color:var(--line)}
.stars button.on{color:var(--marigold)}
.who{font:500 12.5px var(--mono);color:var(--muted)}
.x{position:absolute;top:10px;right:10px;border:0;background:var(--sunk);width:34px;height:34px;border-radius:50%;font-size:18px;z-index:2}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:999px;font-weight:600;font-size:14px;z-index:20;max-width:calc(100vw - 32px)}
/* v2 */
.addrow{display:flex;gap:8px;flex-wrap:wrap;align-items:center;background:var(--surface);border:1px dashed var(--line);border-radius:14px;padding:10px 12px}
.addrow input{flex:1 1 220px;min-width:0;border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:8px 14px}
.inbox{display:grid;gap:8px;margin-bottom:16px}
.inbox:empty{display:none}
.ibx{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--teal);border-radius:10px;padding:8px 12px}
.ibx b{font-weight:600}
.ibx .who{flex:1 1 auto}
.ibx button{border:0;background:none;color:var(--muted);font-size:13px;font-weight:600}
.ask{display:flex;gap:8px;flex-wrap:wrap}
.ask input{flex:1 1 200px;min-width:0;border:1px solid var(--line);background:var(--paper);border-radius:10px;padding:10px 12px}
.why{font:500 13px/1.4 var(--body);font-style:italic;opacity:.85}
.duel{display:grid;gap:18px;justify-items:center;max-width:520px;margin:0 auto}
.duel h2{font:900 34px/1 var(--display);text-transform:uppercase;margin:0;text-align:center}
.duel p{margin:0;color:var(--muted);text-align:center}
.swipe{position:relative;width:min(300px,78vw);aspect-ratio:2/3;touch-action:pan-y;user-select:none}
.scard{position:absolute;inset:0;border-radius:16px;overflow:hidden;background:var(--sunk);box-shadow:var(--shadow);transition:transform .25s ease,opacity .25s ease}
.scard img{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none}
.scard .cap{position:absolute;left:0;right:0;bottom:0;padding:40px 14px 12px;background:linear-gradient(transparent,rgba(0,0,0,.85));color:#fff}
.scard .cap b{display:block;font:900 26px/1 var(--display);text-transform:uppercase}
.scard .cap span{font:500 12px var(--mono);opacity:.85}
.scard .vote{position:absolute;top:18px;padding:4px 12px;border:3px solid;border-radius:8px;font:900 28px var(--display);text-transform:uppercase;opacity:0;transform:rotate(-12deg)}
.scard .vote.yes{left:14px;color:#3ddc84;border-color:#3ddc84}
.scard .vote.no{right:14px;color:#ff5a6e;border-color:#ff5a6e;transform:rotate(12deg)}
.dbtns{display:flex;gap:14px}
.dbtns button{width:64px;height:64px;border-radius:50%;border:2px solid var(--line);background:var(--surface);font:900 22px var(--display)}
.dbtns .y{border-color:var(--good);color:var(--good)}
.dbtns .n{border-color:var(--magenta);color:var(--magenta)}
.progress{font:600 13px var(--mono);color:var(--muted)}
.matches{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px;width:100%}
.matches .card .ctitle{font-size:13px}
.sealed{font:500 12.5px var(--mono);color:var(--teal)}
.match{display:flex;gap:20px;align-items:center;flex-wrap:wrap}
.disagree{display:grid;gap:6px;font-size:14px}
.cal{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.cal input{border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:7px 10px;min-width:0}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>

</head><body>
<div class="wrap">
  <header>
    <div class="top">
      <div class="brand"><h1>Two-Seat <span>Cinema</span></h1><small id="tally">loading the pile…</small></div>
      <nav role="tablist" aria-label="Sections">
        <button role="tab" id="tab-pile" aria-selected="true" data-view="pile">The Pile</button>
        <button role="tab" id="tab-tonight" aria-selected="false" data-view="tonight">Tonight</button>
        <button role="tab" id="tab-duel" aria-selected="false" data-view="duel">Duel</button>
        <button role="tab" id="tab-board" aria-selected="false" data-view="board">Scoreboard</button>
      </nav>
      <div class="me" id="mebox"><span id="mename">you</span><span class="lvl" id="melvl">Usher</span></div>
    </div>
    <div class="syncnote" id="syncnote" hidden></div>
  </header>

  <main>
    <!-- THE PILE -->
    <section id="view-pile">
      <div class="filters">
        <div class="searchrow">
          <label class="search"><span aria-hidden="true">⌕</span><input id="q" type="search" placeholder="Title, director, actor…" autocomplete="off" aria-label="Search the pile"></label>
          <select id="sort" aria-label="Sort">
            <option value="list">List order</option>
            <option value="score">Best rated</option>
            <option value="new">Newest</option>
            <option value="old">Oldest</option>
            <option value="short">Shortest</option>
            <option value="az">A–Z</option>
            <option value="shuffle">Shuffle</option>
          </select>
          <span class="count" id="count"></span>
          <button class="clear" id="clear" type="button">Reset filters</button>
          <button class="chip ftoggle" id="ftoggle" type="button" aria-expanded="false">Filters</button>
        </div>
        <div class="chips fx" id="f-status"><span class="lab">Status</span></div>
        <div class="chips fx" id="f-genre"><span class="lab">Genre</span></div>
        <div class="chips fx" id="f-plat"><span class="lab">Stream</span></div>
        <div class="chips fx" id="f-lang" hidden><span class="lab">Language</span></div>
        <div class="chips fx" id="f-more"><span class="lab">Length</span></div>
      </div>
      <form class="addrow" id="addform" autocomplete="off">
        <input id="addtitle" maxlength="120" placeholder="Saw one on Instagram? Add a title or paste the link" aria-label="Film title or link">
        <button class="btn primary" type="submit">Add to the pile</button>
      </form>
      <div class="inbox" id="inbox" style="margin-top:12px"></div>
      <div class="grid" id="grid"></div>
    </section>

    <!-- TONIGHT -->
    <section id="view-tonight" hidden>
      <div class="tonight">
        <div class="panel">
          <h2>What are we watching?</h2>
          <p class="sub">Set the mood, spin the reel. Each night gets three vetoes, then it's final.</p>
          <div class="q"><span class="lab">Mood</span><div class="chips" id="t-mood"></div></div>
          <div class="q"><span class="lab">Time we've got</span><div class="chips" id="t-time"></div></div>
          <div class="q"><span class="lab">Apps we have</span><div class="chips" id="t-plat"></div></div>
          <div class="q"><span class="lab">Rules</span><div class="chips" id="t-rules"></div></div>
          <div class="q"><span class="lab">Or just say it</span>
            <div class="ask"><input id="askq" maxlength="200" placeholder="Something short and stupid after a long day"><button class="btn" type="button" id="askbtn">Ask Claude</button></div>
            <div class="who" id="askmsg" hidden></div></div>
          <div class="pool" id="pool"></div>
          <button class="big" id="spin" type="button">Spin the reel</button>
        </div>
        <div class="stage">
          <div class="reel" id="reel"><div class="strip" id="strip"></div><div class="reelidle" id="reelidle">Feature presentation<small>Your pick lands here</small></div></div>
          <div id="ticketzone" class="stage"></div>
        </div>
      </div>
    </section>

    <!-- DUEL -->
    <section id="view-duel" hidden><div class="duel" id="duel"></div></section>

    <!-- SCOREBOARD -->
    <section id="view-board" hidden>
      <div class="board" id="board"></div>
    </section>
  </main>
</div>

<dialog id="dlg" aria-labelledby="dtitle"></dialog>
<div class="toast" id="toast" hidden role="status"></div>

<script>
/* ---------- constants ---------- */
const MOODS = {
  any:{label:"Surprise me", g:null},
  cozy:{label:"Cozy", g:["Animation","Family","Romance","Comedy"]},
  laugh:{label:"Laugh", g:["Comedy"]},
  scared:{label:"Get scared", g:["Horror"]},
  edge:{label:"Edge of seat", g:["Thriller","Crime","Action","Mystery"]},
  cry:{label:"Have a cry", g:["Drama","Romance"], not:["Comedy","Horror"]},
  brain:{label:"Mind-bend", g:["Science Fiction","Mystery","Fantasy"]},
  anim:{label:"Animated", g:["Animation"]},
};
const TIMES = {any:{label:"All night",max:999}, t90:{label:"≤ 1h 40",max:100}, t120:{label:"≤ 2h",max:120}, t150:{label:"≤ 2h 30",max:150}};
const LEVELS = [[0,"Usher"],[60,"Ticket taker"],[150,"Projectionist"],[300,"Critic"],[500,"Programmer"],[800,"Auteur"]];
const STATUS_LABEL = {watched:"Watched", want:"Want", nah:"Nah"};

/* ---------- state ---------- */
let MOVIES = [], BYID = {};
let me = {id:"local", name:""}, canWrite = true, mode = "local";
let people = {};          // uid -> {marks:{}}
let nights = [];          // [{id, mid, at, by, vetoes, done}]
let names = {};           // uid -> display name
const ui = loadLocal("tsc-ui", {view:"pile", q:"", sort:"list", status:"all", genres:[], plats:[], len:"any", src:"all", hideSoon:false,
  mood:"any", time:"any", tplats:[], rules:{unwatched:true, released:true, rent:false, wantFirst:false}});
let spin = {vetoes:3, current:null, spinning:false};
let inbox = [], duel = null;
ui.langs ||= []; ui.rules.deep ??= false;

function loadLocal(k, d){ try{ const v = JSON.parse(localStorage.getItem(k)); return v ? Object.assign(d, v) : d }catch(e){ return d } }
function saveLocal(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)) }catch(e){} }
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const mins = m => m ? (m >= 60 ? `${Math.floor(m/60)}h ${String(m%60).padStart(2,"0")}` : `${m}m`) : "—";
function toast(msg){ const t = $("#toast"); t.textContent = msg; t.hidden = false; clearTimeout(toast._t); toast._t = setTimeout(() => t.hidden = true, 2200) }

/* ---------- marks ---------- */
const myMarks = () => (people[me.id] ||= {marks:{}}).marks;
const markOf = (uid, mid) => people[uid]?.marks?.[mid] || null;
function upcoming(m){ return !m.matched || (m.year > 2026) || (m.year === 2026 && !m.stream?.length && !m.rating) }
function watchers(mid){ return Object.keys(people).filter(u => people[u].marks?.[mid]?.s === "watched") }

let writeChain = Promise.resolve(), writeTimer = null;
function setMark(mid, patch){
  const cur = myMarks()[mid] || {};
  const next = Object.assign({}, cur, patch, {at: Date.now()});
  if (!next.s && !next.st) delete myMarks()[mid]; else myMarks()[mid] = next;
  if (mode === "api") api("POST", "/marks", {mid, s: next.s || null, st: next.st || 0}).catch(() => toast("That mark didn't save. Check your connection."));
  else persistMe();
  renderAll();
}
function persistMe(){
  if (mode !== "api"){ saveLocal("tsc-marks", myMarks()); return }
}
function showSync(t){ const n = $("#syncnote"); n.textContent = t; n.hidden = false }

/* ---------- XP / badges ---------- */
function statsFor(uid){
  const marks = people[uid]?.marks || {};
  let xp = 0, watched = [], rated = 0;
  for (const [mid, mk] of Object.entries(marks)){
    const m = BYID[mid]; if (!m) continue;
    if (mk.s === "watched"){ watched.push(m); xp += 10 + Math.floor((m.runtime || 90) / 30) * 3 }
    if (mk.st){ rated++; xp += 2 }
  }
  const mine = nights.filter(n => n.by === uid);
  xp += mine.length * 5;
  let lvl = LEVELS[0], next = null;
  for (let i = 0; i < LEVELS.length; i++){ if (xp >= LEVELS[i][0]){ lvl = LEVELS[i]; next = LEVELS[i+1] || null } }
  return {xp, watched, rated, nights: mine, lvl, next};
}
function badgesFor(st){
  const w = st.watched, g = name => w.filter(m => m.genres?.includes(name)).length;
  const released = MOVIES.filter(m => !upcoming(m)).length;
  const hour = n => new Date(n.at).getHours();
  return [
    ["First show", "Watch one film off the pile", w.length >= 1],
    ["Fearless", "3 horror films", g("Horror") >= 3],
    ["Ink & paint", "3 animated films", g("Animation") >= 3],
    ["Tissue box", "3 dramas", g("Drama") >= 3],
    ["Laugh track", "5 comedies", g("Comedy") >= 5],
    ["Mind melt", "3 sci-fi or mystery", w.filter(m => m.genres?.some(x => x === "Science Fiction" || x === "Mystery")).length >= 3],
    ["Old print", "Something from before 1990", w.some(m => m.year && m.year < 1990)],
    ["Long haul", "A film over 2h 30", w.some(m => (m.runtime || 0) >= 150)],
    ["Both feeds", "One from WhatsApp, one from Instagram", w.some(m => m.source === "WhatsApp") && w.some(m => m.source === "Instagram")],
    ["Night owl", "Lock in a pick after 11 pm", st.nights.some(n => hour(n) >= 23 || hour(n) < 4)],
    ["No regrets", "Lock the first spin, zero vetoes", st.nights.some(n => n.vetoes === 0)],
    ["Quarter pile", "25% of released films watched", released && w.length / released >= .25],
  ];
}
function weekKey(t){ const d = new Date(t); d.setHours(0,0,0,0); d.setDate(d.getDate() + 3 - (d.getDay() + 6) % 7); const y = new Date(d.getFullYear(),0,4); return d.getFullYear() + "-" + (1 + Math.round(((d - y) / 864e5 - 3 + (y.getDay() + 6) % 7) / 7)) }
function streak(){
  const weeks = new Set(nights.map(n => weekKey(n.at))); let s = 0, t = Date.now();
  if (!weeks.has(weekKey(t))) t -= 7 * 864e5;
  while (weeks.has(weekKey(t))){ s++; t -= 7 * 864e5 }
  return s;
}

/* ---------- PILE ---------- */
function chip(label, pressed, onclick, dot){
  const b = document.createElement("button"); b.type = "button"; b.className = "chip"; b.setAttribute("aria-pressed", pressed ? "true" : "false");
  b.innerHTML = (dot ? `<i class="dot" style="background:${esc(dot)}"></i>` : "") + esc(label); b.onclick = onclick; return b;
}
function fillChips(el, items){ el.querySelectorAll(".chip").forEach(c => c.remove()); items.forEach(i => el.appendChild(i)) }
let PLATS = [], GENRES = [];
function renderFilters(){
  renderLangChips();
  fillChips($("#f-status"), [["all","All"],["unwatched","Not seen by me"],["want","Want"],["watched","Watched"],["together","Seen by both"],["soon","Coming soon"]]
    .map(([k,l]) => chip(l, ui.status === k, () => { ui.status = k; renderPile() })));
  fillChips($("#f-genre"), GENRES.map(g => chip(g, ui.genres.includes(g), () => { toggle(ui.genres, g); renderPile() })));
  fillChips($("#f-plat"), [...PLATS.map(p => chip(p.name, ui.plats.includes(p.name), () => { toggle(ui.plats, p.name); renderPile() }, p.color)),
    chip("Not streaming", ui.plats.includes("__none"), () => { toggle(ui.plats, "__none"); renderPile() })]);
  fillChips($("#f-more"), [...Object.entries({any:"Any",short:"Under 1h 40",mid:"1h 40–2h 15",long:"Over 2h 15"}).map(([k,l]) => chip(l, ui.len === k, () => { ui.len = k; renderPile() })),
    ...[["all","Both lists"],["WhatsApp","WhatsApp"],["Instagram","Instagram"]].map(([k,l]) => chip(l, ui.src === k, () => { ui.src = k; renderPile() }))]);
}
function renderLangChips(){
  const lc = {}; MOVIES.forEach(m => (m.lang || []).forEach(l => lc[l] = (lc[l] || 0) + 1));
  const langs = Object.keys(lc).filter(l => lc[l] >= 2).sort((a,b) => lc[b] - lc[a]);
  $("#f-lang").hidden = !langs.length;
  fillChips($("#f-lang"), langs.map(l => chip(l, ui.langs.includes(l), () => { toggle(ui.langs, l); renderPile() })));
}
function toggle(a, v){ const i = a.indexOf(v); i < 0 ? a.push(v) : a.splice(i, 1) }
let shuffleSeed = Math.random();
function filtered(){
  const q = ui.q.trim().toLowerCase();
  let list = MOVIES.filter(m => {
    if (q && ![m.title, m.orig, m.q, ...(m.directors||[]), ...(m.cast||[])].some(s => s && s.toLowerCase().includes(q))) return false;
    const mk = markOf(me.id, m.id);
    if (ui.status === "unwatched" && mk?.s === "watched") return false;
    if (ui.status === "want" && mk?.s !== "want") return false;
    if (ui.status === "watched" && mk?.s !== "watched") return false;
    if (ui.status === "together" && watchers(m.id).length < 2) return false;
    if (ui.status === "soon" && !upcoming(m)) return false;
    if (ui.genres.length && !ui.genres.every(g => m.genres?.includes(g))) return false;
    if (ui.plats.length){
      const names = (m.stream || []).map(s => s.name);
      if (!ui.plats.some(p => p === "__none" ? !names.length : names.includes(p))) return false;
    }
    const r = m.runtime;
    if (ui.len === "short" && !(r && r < 100)) return false;
    if (ui.len === "mid" && !(r && r >= 100 && r <= 135)) return false;
    if (ui.len === "long" && !(r && r > 135)) return false;
    if (ui.src !== "all" && m.source !== ui.src) return false;
    if (ui.langs.length && !ui.langs.some(l => (m.lang || []).includes(l))) return false;
    return true;
  });
  const by = {
    list:(a,b) => a.id - b.id, score:(a,b) => (b.rating||0) - (a.rating||0), new:(a,b) => (b.year||0) - (a.year||0),
    old:(a,b) => (a.year||9999) - (b.year||9999), short:(a,b) => (a.runtime||999) - (b.runtime||999), az:(a,b) => a.title.localeCompare(b.title),
    shuffle:(a,b) => hash(a.id + shuffleSeed) - hash(b.id + shuffleSeed)
  }[ui.sort];
  return list.sort(by);
}
function hash(x){ let s = Math.sin(x * 9301 + 49297) * 233280; return s - Math.floor(s) }
function posterImg(m, cls = ""){ return m.poster ? `<img src="${esc(m.poster)}" alt="" loading="lazy" decoding="async" class="${cls}">` : `<div class="noposter">${esc(m.title)}</div>` }
function stampFor(m){
  const mk = markOf(me.id, m.id);
  if (mk?.s) return `<span class="stamp ${mk.s}">${STATUS_LABEL[mk.s]}</span>`;
  if (upcoming(m)) return `<span class="stamp soon">Coming</span>`;
  return "";
}
function renderPile(){
  renderFilters(); $("#q").value = ui.q; $("#sort").value = ui.sort;
  const list = filtered();
  $("#count").textContent = `${list.length} of ${MOVIES.length}`;
  $("#grid").innerHTML = list.length ? list.map(m => `
    <button class="card" type="button" data-id="${m.id}" aria-label="${esc(m.title)}${m.year ? ", " + m.year : ""}">
      <div class="pwrap">${posterImg(m)}${m.rating ? `<span class="score">${m.rating}</span>` : ""}${stampFor(m)}</div>
      <div class="ctitle">${esc(m.title)}</div>
      <div class="cmeta"><span>${m.year || "?"}</span>${m.runtime ? `<span>· ${mins(m.runtime)}</span>` : ""}
        ${m.stream?.length ? `<span class="plat">${m.stream.slice(0,4).map(s => `<i title="${esc(s.name)}" style="background:${esc(s.color || "#888")}"></i>`).join("")}</span>` : ""}</div>
    </button>`).join("") : `<div class="empty">Nothing matches. Loosen a filter or <button class="clear" type="button" onclick="resetFilters()">reset them all</button>.</div>`;
  saveLocal("tsc-ui", ui);
}
function resetFilters(){ Object.assign(ui, {q:"", status:"all", genres:[], plats:[], len:"any", src:"all"}); renderPile() }

/* ---------- DETAIL ---------- */
function openDetail(id){
  const m = BYID[id]; if (!m) return;
  const mk = markOf(me.id, id) || {};
  const others = Object.keys(people).filter(u => u !== me.id && people[u].marks?.[id]);
  const dlg = $("#dlg");
  dlg.innerHTML = `<button class="x" type="button" aria-label="Close" onclick="dlg.close()">×</button>
  <div class="dl">
    <div class="dp">${posterImg(m)}</div>
    <div class="dbody">
      <h2 class="dtitle" id="dtitle">${esc(m.title)}</h2>
      ${m.orig ? `<div class="dorig">${esc(m.orig)}</div>` : ""}
      ${m.q && m.q.toLowerCase() !== (m.title||"").toLowerCase() ? `<div class="dorig">On your list as “${esc(m.q)}”</div>` : ""}
      <div class="dmeta"><span>${m.year || "Year unknown"}</span><span>${mins(m.runtime)}</span>${m.rating ? `<span>Score ${m.rating}/100</span>` : ""}<span>${esc((m.genres||[]).join(" · "))}</span></div>
      ${m.overview ? `<p class="dover">${esc(m.overview)}</p>` : ""}
      ${m.directors?.length || m.cast?.length ? `<div class="dcrew">${m.directors?.length ? `Directed by <b>${esc(m.directors.join(", "))}</b>. ` : ""}${m.cast?.length ? `With ${esc(m.cast.slice(0,4).join(", "))}.` : ""}</div>` : ""}
      <div class="where">${m.stream?.length ? m.stream.map(s => `<a href="${esc(s.link)}" target="_blank" rel="noopener"><i style="background:${esc(s.color || "#888")}"></i>${esc(s.name)} <small>${esc(s.type === "subscription" ? "" : s.type || "")}</small></a>`).join("") : `<span class="who">Not streaming in India right now${upcoming(m) ? " (not out yet)" : ""}.</span>`}</div>
      <div class="where"><a href="${esc(m.trailer || "https://www.youtube.com/results?search_query=" + encodeURIComponent(m.title + " " + (m.year || "") + " trailer"))}" target="_blank" rel="noopener">Watch trailer <small>YouTube</small></a>${m.imdb ? `<a href="https://www.imdb.com/title/${esc(m.imdb)}/" target="_blank" rel="noopener">IMDb</a>` : ""}${(m.lang||[]).length ? `<span class="who">${esc(m.lang.join(", "))}</span>` : ""}</div>
      ${m.note ? `<div class="note">From ${esc(m.source)}. ${esc(m.note.replace(/^guess: ?/, "Best guess: "))}</div>` : `<div class="who">From the ${esc(m.source)} list</div>`}
      <div class="marks">${["watched","want","nah"].map(s => `<button class="btn" type="button" aria-pressed="${mk.s === s}" data-mark="${s}">${STATUS_LABEL[s]}</button>`).join("")}</div>
      <div class="stars" aria-label="Your rating">${[1,2,3,4,5].map(n => `<button type="button" class="${(mk.st||0) >= n ? "on" : ""}" data-star="${n}" aria-label="${n} star${n>1?"s":""}">★</button>`).join("")}</div>
      ${others.length ? `<div class="who">${others.map(u => { const om = people[u].marks[id];
          const stars = om.st ? (mk.st ? " " + "★".repeat(om.st) : "") : "";
          return `${esc(names[u] || "Your friend")}: ${esc(STATUS_LABEL[om.s] || "rated")}${stars}`; }).join(" · ")}</div>
        ${others.some(u => people[u].marks[id].st) && !mk.st ? `<div class="sealed">Sealed verdict waiting. Rate it to see their stars.</div>` : ""}` : ""}
      <button class="btn primary" type="button" id="spinthis">Make this tonight's pick</button>
    </div>
  </div>`;
  dlg.querySelectorAll("[data-mark]").forEach(b => b.onclick = () => { const s = b.dataset.mark; setMark(id, {s: mk.s === s ? null : s}); openDetail(id) });
  dlg.querySelectorAll("[data-star]").forEach(b => b.onclick = () => { const n = +b.dataset.star; setMark(id, {st: mk.st === n ? 0 : n, s: "watched"}); openDetail(id) });
  dlg.querySelector("#spinthis").onclick = () => { dlg.close(); go("tonight"); land(m, true) };
  if (!dlg.open) dlg.showModal();
}
const dlg = $("#dlg");
dlg.addEventListener("click", e => { if (e.target === dlg) dlg.close() });

/* ---------- TONIGHT ---------- */
function renderTonightControls(){
  fillChips($("#t-mood"), Object.entries(MOODS).map(([k,v]) => chip(v.label, ui.mood === k, () => { ui.mood = k; renderTonightControls() })));
  fillChips($("#t-time"), Object.entries(TIMES).map(([k,v]) => chip(v.label, ui.time === k, () => { ui.time = k; renderTonightControls() })));
  fillChips($("#t-plat"), PLATS.map(p => chip(p.name, ui.tplats.includes(p.name), () => { toggle(ui.tplats, p.name); renderTonightControls() }, p.color)));
  const R = ui.rules;
  fillChips($("#t-rules"), [
    chip("Neither of us has seen it", R.unwatched, () => { R.unwatched = !R.unwatched; renderTonightControls() }),
    chip("Out now", R.released, () => { R.released = !R.released; renderTonightControls() }),
    chip("Rentals OK", R.rent, () => { R.rent = !R.rent; renderTonightControls() }),
    chip("Wants count double", R.wantFirst, () => { R.wantFirst = !R.wantFirst; renderTonightControls() }),
    chip("Deep cuts only", R.deep, () => { R.deep = !R.deep; renderTonightControls() }),
  ]);
  const p = pool();
  $("#pool").innerHTML = p.length ? `<b>${p.length}</b> film${p.length === 1 ? "" : "s"} in the reel` : `No films fit. Loosen the mood, time or apps.`;
  $("#spin").disabled = !p.length || spin.spinning;
  $("#spin").textContent = spin.current && !spin.locked ? (spin.vetoes > 0 ? `Veto & respin (${spin.vetoes} left)` : "No vetoes left") : "Spin the reel";
  if (spin.current && !spin.locked && spin.vetoes <= 0) $("#spin").disabled = true;
  saveLocal("tsc-ui", ui);
}
function pool(){
  const mood = MOODS[ui.mood], max = TIMES[ui.time].max, R = ui.rules;
  return MOVIES.filter(m => {
    if (!m.matched) return false;
    if (R.released && upcoming(m)) return false;
    if (R.unwatched && watchers(m.id).length) return false;
    if (Object.values(people).some(p => p.marks?.[m.id]?.s === "nah")) return false;
    if (R.deep && !((m.rating && m.rating < 65) || (m.year && m.year < 1995))) return false;
    if (ui.langs.length && !ui.langs.some(l => (m.lang || []).includes(l))) return false;
    if (mood.g && !m.genres?.some(g => mood.g.includes(g))) return false;
    if (mood.not && m.genres?.some(g => mood.not.includes(g))) return false;
    if (max < 999 && (m.runtime || 120) > max) return false;
    if (ui.tplats.length){
      const ok = (m.stream || []).some(s => ui.tplats.includes(s.name) && (R.rent || s.type === "subscription" || s.type === "free" || s.type === "addon"));
      if (!ok) return false;
    }
    return true;
  });
}
function weightedPick(p){
  const w = p.map(m => 1 + (ui.rules.wantFirst ? Object.values(people).filter(x => x.marks?.[m.id]?.s === "want").length * 2 : 0));
  let r = Math.random() * w.reduce((a,b) => a + b, 0);
  for (let i = 0; i < p.length; i++){ r -= w[i]; if (r <= 0) return p[i] }
  return p[p.length - 1];
}
function doSpin(){
  if (spin.spinning) return;
  if (spin.current && !spin.locked){ if (spin.vetoes <= 0) return; spin.vetoes-- }
  if (spin.locked){ spin = {vetoes:3, current:null, spinning:false} }
  let p = pool(); if (!p.length) return;
  if (spin.current && p.length > 1) p = p.filter(m => m.id !== spin.current.id);
  land(weightedPick(p), false, p);
}
function land(target, direct, p, why){
  spin.why = why || "";
  spin.spinning = true; spin.current = target; spin.locked = false;
  if (direct) spin.vetoes = 3;
  $("#reelidle").hidden = true; $("#ticketzone").innerHTML = "";
  const strip = $("#strip"), reel = $("#reel");
  const src = (p && p.length ? p : MOVIES.filter(m => m.poster));
  const n = direct ? 1 : 26, frames = [];
  for (let i = 0; i < n - 1; i++) frames.push(src[Math.floor(Math.random() * src.length)]);
  frames.push(target);
  strip.innerHTML = frames.map(m => m.poster ? `<img src="${esc(m.poster)}" alt="">` : `<div class="ph">${esc(m.title)}</div>`).join("");
  const h = reel.clientHeight, dist = (n - 1) * h;
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  renderTonightControls();

/* ---------- DUEL ---------- */
let duelChain = Promise.resolve();
function duelVoters(){ return Object.keys(duel?.votes || {}) }
function doneCount(u){ return Object.keys(duel?.votes?.[u] || {}).length }
function renderDuel(){
  const el = $("#duel");
  if (!duel){
    el.innerHTML = `<h2>Swipe duel</h2><p>You each swipe the same 10 films, separately. Only the ones you both say yes to get revealed. Uses your Tonight filters.</p>
      <div class="pool">${pool().length} films fit your Tonight filters</div>
      <button class="big" type="button" id="dstart" ${pool().length < 3 ? "disabled" : ""}>Deal 10 cards</button>`;
    $("#dstart").onclick = startDuel; return;
  }
  const mine = duel.votes?.[me.id] || {}, cards = duel.cards || [];
  const next = cards.find(c => !(String(c) in mine));
  if (next !== undefined){
    const m = BYID[next];
    el.innerHTML = `<h2>Swipe duel</h2><div class="progress">Card ${Object.keys(mine).length + 1} of ${cards.length}</div>
      <div class="swipe"><div class="scard" id="scard">${m.poster ? `<img src="${esc(m.poster)}" alt="">` : `<div class="noposter">${esc(m.title)}</div>`}
        <span class="vote yes">Yes</span><span class="vote no">Nope</span>
        <div class="cap"><b>${esc(m.title)}</b><span>${m.year || ""} · ${mins(m.runtime)} · ${esc((m.genres||[]).slice(0,2).join(" / "))}</span></div></div></div>
      <div class="dbtns"><button class="n" type="button" id="dno" aria-label="No">✕</button><button class="btn" type="button" id="dinfo">Details</button><button class="y" type="button" id="dyes" aria-label="Yes">✓</button></div>
      <p class="who">Swipe right for yes, left for no. Arrow keys work too.</p>`;
    $("#dno").onclick = () => vote(next, false); $("#dyes").onclick = () => vote(next, true); $("#dinfo").onclick = () => openDetail(next);
    dragify($("#scard"), v => vote(next, v));
    return;
  }
  const finished = duelVoters().filter(u => doneCount(u) >= cards.length);
  const others = finished.filter(u => u !== me.id);
  if (!others.length){
    const prog = duelVoters().filter(u => u !== me.id).map(u => doneCount(u))[0] || 0;
    el.innerHTML = `<h2>Your hand is in</h2><p>Waiting for your friend to swipe (${prog} of ${cards.length} done). Matches appear here the moment they finish.</p>
      <p class="who">You said yes to ${Object.values(mine).filter(Boolean).length} of ${cards.length}. Theirs stay hidden until the reveal.</p>
      <button class="btn" type="button" id="dnew">Deal a new hand instead</button>`;
    $("#dnew").onclick = startDuel; return;
  }
  const matches = cards.filter(c => finished.every(u => duel.votes[u][String(c)])).map(c => BYID[c]).filter(Boolean);
  el.innerHTML = `<h2>${matches.length ? `${matches.length} match${matches.length > 1 ? "es" : ""}` : "No matches"}</h2>
    <p>${matches.length ? "You both said yes to these." : "Nothing you both wanted. Deal again."}</p>
    ${matches.length ? `<div class="matches">${matches.map(m => `<button class="card" type="button" data-id="${m.id}"><div class="pwrap">${posterImg(m)}</div><div class="ctitle">${esc(m.title)}</div></button>`).join("")}</div>` : ""}
    <div class="tactions">${matches.length ? `<button class="btn primary grow" type="button" id="dspin">Spin from the matches</button>` : ""}<button class="btn grow" type="button" id="dnew">Deal a new hand</button></div>`;
  el.querySelectorAll(".card").forEach(c => c.onclick = () => openDetail(+c.dataset.id));
  if ($("#dspin")) $("#dspin").onclick = () => { go("tonight"); spin = {vetoes:3, current:null, spinning:false}; land(matches[Math.floor(Math.random() * matches.length)], matches.length < 2, matches, "From your swipe duel: you both said yes.") };
  $("#dnew").onclick = startDuel;
}
async function startDuel(){
  const p = pool().slice(); if (p.length < 3) return;
  for (let i = p.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [p[i], p[j]] = [p[j], p[i]] }
  const body = {cards: p.slice(0, 10).map(m => m.id), at: Date.now(), by: me.id, votes: {}};
  if (mode === "api"){ try{ await api("POST", "/duel", {cards: body.cards}) }catch(e){ toast("Couldn't deal. Try again."); return } }
  else saveLocal("tsc-duel", body);
  duel = body; renderDuel();
}
function vote(mid, yes){
  duel.votes ||= {}; (duel.votes[me.id] ||= {})[String(mid)] = yes;
  if (mode === "api") duelChain = duelChain.then(() => api("POST", "/duel/vote", {mid, yes})).catch(() => toast("A vote didn't save."));

function dragify(card, cb){
  let x0 = null, dx = 0;
  const yes = card.querySelector(".yes"), no = card.querySelector(".no");
  card.addEventListener("pointerdown", e => { x0 = e.clientX; dx = 0; card.setPointerCapture(e.pointerId); card.style.transition = "none" });
  card.addEventListener("pointermove", e => { if (x0 === null) return; dx = e.clientX - x0; card.style.transform = `translateX(${dx}px) rotate(${dx / 18}deg)`; yes.style.opacity = Math.max(0, dx / 90); no.style.opacity = Math.max(0, -dx / 90) });
  const end = () => { if (x0 === null) return; x0 = null; card.style.transition = "";
    if (Math.abs(dx) > 90){ card.style.transform = `translateX(${dx > 0 ? 600 : -600}px) rotate(${dx / 8}deg)`; card.style.opacity = 0; setTimeout(() => cb(dx > 0), 180) }
    else { card.style.transform = ""; yes.style.opacity = 0; no.style.opacity = 0 } };
  card.addEventListener("pointerup", end); card.addEventListener("pointercancel", end);
}

/* ---------- TASTE MATCH ---------- */
function tasteHTML(){
  const u = Object.keys(people).find(x => x !== me.id); if (!u) return "";
  const both = MOVIES.filter(m => markOf(me.id, m.id)?.st && markOf(u, m.id)?.st);
  const who = esc(names[u] || "your friend");
  if (!both.length) return `<div class="together"><div><div class="h3" style="margin:0">Taste match: sealed</div><div class="who">Both rate the same film to unlock how alike your taste is.</div></div></div>`;
  const diffs = both.map(m => ({m, a: markOf(me.id, m.id).st, b: markOf(u, m.id).st})).map(x => ({...x, d: Math.abs(x.a - x.b)}));
  const pct = Math.round(100 - diffs.reduce((s, x) => s + x.d, 0) / diffs.length * 25);
  const fights = diffs.filter(x => x.d >= 2).sort((a,b) => b.d - a.d).slice(0, 3);
  return `<div class="together">${ring(pct / 100)}<div style="min-width:0"><div class="big2">${pct}% taste match</div><div class="who">across ${both.length} film${both.length > 1 ? "s" : ""} you both rated</div>
    ${fights.length ? `<div class="disagree" style="margin-top:8px"><b>Biggest fights</b>${fights.map(x => `<span>${esc(x.m.title)}: you ${"★".repeat(x.a)}, ${who} ${"★".repeat(x.b)}</span>`).join("")}</div>` : ""}</div></div>`;
}

/* ---------- BOOK IT ---------- */
function calLink(m){
  const t = ($("#caltime") && $("#caltime").value) || "21:00", email = (($("#calmail") && $("#calmail").value) || "").trim();
  const [h, mi] = t.split(":").map(Number), start = new Date(); start.setHours(h, mi, 0, 0);
  const end = new Date(start.getTime() + ((m.runtime || 120) + 20) * 60000);
  const f = d => `${d.getFullYear()}${String(d.getMonth()+1).padStart(2,"0")}${String(d.getDate()).padStart(2,"0")}T${String(d.getHours()).padStart(2,"0")}${String(d.getMinutes()).padStart(2,"0")}00`;
  const s = bestStream(m);
  const q = new URLSearchParams({action: "TEMPLATE", text: `Movie night: ${m.title}`, dates: `${f(start)}/${f(end)}`, details: `Picked on Two-Seat Cinema.${s ? ` Watch on ${s.name}: ${s.link}` : ""}`});
  if (email) q.set("add", email);
  return "https://calendar.google.com/calendar/render?" + q;
}

/* ---------- boot ---------- */
async function boot(){
  try{ MOVIES = await (await fetch("data.json")).json() }catch(e){ $("#grid").innerHTML = `<div class="empty">The film list didn't load. Reload the page.</div>`; return }
  MOVIES.forEach(m => BYID[m.id] = m);
  const pc = {}; MOVIES.forEach(m => (m.stream||[]).forEach(s => { pc[s.name] ||= {name:s.name, color:s.color, n:0}; pc[s.name].n++ }));
  PLATS = Object.values(pc).sort((a,b) => b.n - a.n);
  const gc = {}; MOVIES.forEach(m => (m.genres||[]).forEach(g => gc[g] = (gc[g]||0) + 1));
  GENRES = Object.keys(gc).filter(g => gc[g] >= 3).sort((a,b) => gc[b] - gc[a]);
  people.local = {marks: loadLocal("tsc-marks", {})};
  nights = loadLocal("tsc-nights", []); if (!Array.isArray(nights)) nights = [];
  inbox = loadLocal("tsc-inbox", []); if (!Array.isArray(inbox)) inbox = [];
  { const d = loadLocal("tsc-duel", {}); duel = d.cards ? d : null }
  go(ui.view || "pile");
  connect();
}
async function api(method, path, data){
  const r = await fetch("/api" + path, {method, headers: data ? {"content-type": "application/json"} : {}, body: data ? JSON.stringify(data) : undefined, credentials: "same-origin"});
  if (!r.ok) throw Object.assign(new Error("api"), {status: r.status});
  return r.json();
}
let stateV = null, pollTimer = null;
function applyState(st){
  const mine = mode === "api" && people[me.id] ? people[me.id].marks : null;
  me = {id: st.me.id, name: st.me.name};
  people = {}; names = {};
  for (const [u, p] of Object.entries(st.people)){ people[u] = {marks: p.marks || {}}; names[u] = p.name || u.split("@")[0] }
  people[me.id] ||= {marks: {}};
  nights = st.nights || []; duel = st.duel; inbox = st.inbox || [];
  // films added through the inbox join the pile
  MOVIES = MOVIES.filter(m => !m.fromInbox);
  for (const i of inbox) if (i.details){ const m = {...i.details, poster: i.details.poster ? "/img?u=" + encodeURIComponent(i.details.poster) : null, id: 10000 + i.id, q: i.title, source: "Added", note: "", status: "ok", fromInbox: true}; MOVIES.push(m) }
  BYID = {}; MOVIES.forEach(m => BYID[m.id] = m);
}
async function poll(force){
  try{
    const st = await api("GET", "/state" + (stateV !== null && !force ? "?v=" + stateV : ""));
    if (st.same) return;
    stateV = st.v; applyState(st); renderAll();
    if (!me.name && !askedName){ askedName = true; askName() }
  }catch(e){ if (e.status === 401) showSync("You're signed out. Reload to sign in again.") }
}
let askedName = false;
function askName(){
  const n = $("#syncnote");
  n.hidden = false;
  n.innerHTML = `<form id="nameform" class="cal"><label for="nm">What should your friend see you as?</label><input id="nm" maxlength="40" placeholder="First name"><button class="btn" type="submit">Save</button></form>`;
  $("#nameform").onsubmit = async e => { e.preventDefault(); const v = $("#nm").value.trim(); if (!v) return; try{ await api("POST", "/name", {name: v}); n.hidden = true; poll(true) }catch(err){ toast("Couldn't save your name.") } };
}
async function connect(){
  try{ const st = await api("GET", "/state") ; mode = "api"; stateV = st.v;
    // carry over anything saved locally before sign-in
    const local = people.local?.marks || {};
    applyState(st);
    for (const [k, v] of Object.entries(local)) if (!people[me.id].marks[k]){ api("POST", "/marks", {mid: +k, s: v.s || null, st: v.st || 0}).catch(() => {}) }
    if (Object.keys(local).length) saveLocal("tsc-marks", {});
    renderAll();
    if (!me.name){ askedName = true; askName() }
  }catch(e){ showSync("Offline mode: marks are saved on this device."); return }
  const tick = () => { if (!document.hidden) poll() };
  pollTimer = setInterval(tick, 10000);
  document.addEventListener("visibilitychange", () => { if (!document.hidden) poll() });
}
function refreshNames(){}
boot();
</script>
