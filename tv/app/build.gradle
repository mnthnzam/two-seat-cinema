plugins { id "com.android.application" }

// Release signing comes from tv/keystore.properties (not in git). Without it, release builds use the debug key.
def ksFile = rootProject.file("keystore.properties")
def ks = new Properties()
if (ksFile.exists()) ksFile.withInputStream { ks.load(it) }

android {
    namespace "com.mnthn.twoseat"
    compileSdk 35
    defaultConfig {
        applicationId "com.mnthn.twoseat"
        minSdk 21
        targetSdk 35
        versionCode 1
        versionName "1.0"
        buildConfigField "String", "APP_URL", "\"https://movies.mnthn.com/\""
    }
    buildFeatures { buildConfig true }
    signingConfigs {
        release {
            if (ks.storeFile) {
                storeFile rootProject.file(ks.storeFile)
                storePassword ks.storePassword
                keyAlias ks.keyAlias
                keyPassword ks.keyPassword
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig ks.storeFile ? signingConfigs.release : signingConfigs.debug
        }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
